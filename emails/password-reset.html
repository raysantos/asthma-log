<!-- Paste into Firebase console: Authentication > Templates > Password reset > edit (pencil) > Message.
     Firebase fills in %LINK% and %EMAIL%. Subject: Reset your Asthma Log password -->
<div style="margin:0;padding:24px 16px;background:#f3f6f8;font-family:'Source Sans 3',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#18262e;">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #dce4e8;border-radius:14px;padding:28px 24px;">
    <p style="margin:0 0 4px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5b6d77;">Medication log</p>
    <h1 style="margin:0 0 20px;font-size:26px;line-height:1.2;font-weight:800;color:#18262e;">Asthma Log</h1>
    <p style="margin:0 0 12px;font-size:16px;line-height:1.5;">Someone asked to reset the password for <strong>%EMAIL%</strong>.</p>
    <p style="margin:0 0 24px;font-size:16px;line-height:1.5;">Tap the button to choose a new one. The link works for one hour.</p>
    <p style="margin:0 0 24px;">
      <a href="%LINK%" style="display:inline-block;background:#1d6a86;color:#ffffff;text-decoration:none;font-weight:700;font-size:16px;padding:14px 22px;border-radius:12px;">Choose a new password</a>
    </p>
    <p style="margin:0;font-size:13px;line-height:1.5;color:#5b6d77;">If you didn't ask for this, you can ignore this email. Your password won't change.</p>
  </div>
</div>
